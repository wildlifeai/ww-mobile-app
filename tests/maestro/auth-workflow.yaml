# Sign-in against the real login screen (src/navigation/screens/auth/LoginScreen.tsx):
# a wrong password is refused and says so, the right one reaches the home
# screen and the project list, and signing out returns to the login screen.
#
# Needs E2E_TEST_EMAIL and E2E_TEST_PASSWORD from the run, see subflows/sign-in.yaml.
# Role checks (who sees what) are not here: the seed gives some users two roles
# in one scope (ww-backend #248, #375), so a role assertion would test the seed.
#
# appId comes from the run (`-e APP_ID=...`), see smoke/app-startup.yaml
appId: ${APP_ID}
---
# A wrong password stays on the login screen and says so (LoginScreen.onSubmit)
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 90000
- tapOn:
    id: "email-input"
- inputText: ${E2E_TEST_EMAIL}
- tapOn:
    id: "password-input"
- inputText: "not-the-password"
- hideKeyboard
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible: "Login Failed"
    timeout: 30000
- tapOn: "OK"
- assertVisible:
    id: "login-button"

# The right one reaches the home screen, and the Projects tab its list
- runFlow: subflows/sign-in.yaml
- assertVisible:
    id: "bottom-tab-scanner"
- tapOn:
    id: "bottom-tab-projects"
- extendedWaitUntil:
    visible:
      id: "project-search-bar"
    timeout: 60000
- takeScreenshot: auth-projects

# Sign out from the drawer (SideNavigation) and land on the login screen
- tapOn:
    id: "drawer-menu-button"
- extendedWaitUntil:
    visible:
      id: "sign-out-button"
    timeout: 15000
- tapOn:
    id: "sign-out-button"
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 30000
- takeScreenshot: auth-signed-out
