# Smoke, the required E2E check: the CI APK installs, launches, and its
# JavaScript bundle renders the first real screen, the login screen.
#
# Until October 2026 this flow only launched and took a screenshot, because the
# CI build was a development client with no bundle inside: every run stopped at
# Expo's launcher (run 36836146016), so there was no screen to assert. CI now
# builds the release-type `e2e` profile, and this flow fails if the bundle does
# not come up. Permissions are granted up front because
# AndroidPermissionsProvider shows nothing else until they are.
#
# appId comes from the run (`-e APP_ID=...`). Both CI profiles install as
# com.wildlife.wildlifewatcher; a local debug build (`npm run android`) is
# com.wildlife.wildlifewatcher.expo, which the npm scripts pass. A fixed `.expo`
# failed the release PR #366 on 1 October 2026: "Package
# com.wildlife.wildlifewatcher.expo is not installed".
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 90000
- assertVisible:
    id: "login-button"
- takeScreenshot: startup
