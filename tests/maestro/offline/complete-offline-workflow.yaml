# Offline cold start: a signed-in user who starts the app with no network stays
# signed in (#310), sees the offline indicator, and still gets the project list
# from the local database.
#
# Until October 2026 this file held ten "tests" against screens the app never
# had (an admin panel, LoRaWAN simulation, conflict review) and shelled out
# from JavaScript, which Maestro cannot do. Airplane mode is a Maestro command
# on Android (`setAirplaneMode`), so the network part is real now, provided the
# device keeps Bluetooth out of airplane mode's radios (scripts/ci-maestro.sh
# sets `airplane_mode_radios`), or the app stops at "Please enable Bluetooth".
# The flow ends with the network back on whatever happens, so the next flow
# starts online.
#
# Needs E2E_TEST_EMAIL and E2E_TEST_PASSWORD from the run, see ../subflows/sign-in.yaml.
# appId comes from the run (`-e APP_ID=...`), see ../smoke/app-startup.yaml
appId: ${APP_ID}
onFlowComplete:
  - setAirplaneMode: disabled
---
- runFlow: ../subflows/sign-in.yaml
# Sync has run by the time the list shows the organisation's projects
- tapOn:
    id: "bottom-tab-projects"
- extendedWaitUntil:
    visible:
      id: "project-search-bar"
    timeout: 60000
- assertNotVisible:
    id: "offline-indicator"

# Go offline and start cold
- setAirplaneMode: enabled
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "bottom-tab-projects"
    timeout: 90000
- extendedWaitUntil:
    visible:
      id: "offline-indicator"
    timeout: 30000
- tapOn:
    id: "bottom-tab-projects"
- extendedWaitUntil:
    visible:
      id: "project-search-bar"
    timeout: 60000
- takeScreenshot: offline-cold-start

# Back online, the indicator goes
- setAirplaneMode: disabled
- extendedWaitUntil:
    notVisible:
      id: "offline-indicator"
    timeout: 60000
