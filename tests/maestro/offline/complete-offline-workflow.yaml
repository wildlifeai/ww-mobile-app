# Offline scenario, phase 2 of 3 (scripts/maestro-offline.sh): the script has
# switched airplane mode on and turned Bluetooth back on. A cold start stays
# signed in (#310), shows the offline indicator, lists projects from the local
# database, and a project created now is listed at once (the outbox). Nothing
# is cleared: the state is phase 1's.
#
# Until October 2026 this file held ten "tests" against screens the app never
# had (an admin panel, LoRaWAN simulation, conflict review) and shelled out
# from JavaScript, which Maestro cannot do. Maestro's own `setAirplaneMode`
# was tried first; it takes the Bluetooth radio down and the app with it
# (runs 36921573134, 36926971767), hence the phases.
#
# OFFLINE_PROJECT_NAME comes from the script, unique per run, and phase 3
# looks for the same name. appId comes from the run (`-e APP_ID=...`).
appId: ${APP_ID}
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "bottom-tab-projects"
    timeout: 90000
- extendedWaitUntil:
    visible:
      id: "offline-indicator"
    timeout: 30000
- tapOn:
    id: "bottom-tab-projects"
- extendedWaitUntil:
    visible:
      id: "project-search-bar"
    timeout: 60000
- takeScreenshot: offline-2-cold-start

# A project created offline is listed at once
- runFlow: ../subflows/open-new-project.yaml
- tapOn:
    id: "project-name-input"
- inputText: ${OFFLINE_PROJECT_NAME}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "create-project-button"
    direction: DOWN
- tapOn:
    id: "create-project-button"
- extendedWaitUntil:
    visible:
      text: ${OFFLINE_PROJECT_NAME}
    timeout: 60000
- assertVisible:
    id: "offline-indicator"
- takeScreenshot: offline-2-created
