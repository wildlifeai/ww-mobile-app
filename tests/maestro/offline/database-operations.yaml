# Offline scenario, phase 3 of 3 (scripts/maestro-offline.sh): the script has
# switched airplane mode off. The indicator goes, the outbox pushes the project
# created in phase 2, and a pull from the server keeps it in the list. Archives
# it afterwards so cloud-dev stays tidy.
#
# Until October 2026 this file asserted screens the app never had ("Database
# Status", "Sync History", a device status page). What the outbox does is in
# documentation/onboarding/03-DATA-AND-SYNC.md.
#
# OFFLINE_PROJECT_NAME comes from the script, the same value phase 2 used.
# appId comes from the run (`-e APP_ID=...`).
appId: ${APP_ID}
---
- extendedWaitUntil:
    notVisible:
      id: "offline-indicator"
    timeout: 60000
# Pull to refresh: SupabaseSyncService.sync(), then the list refetches
- swipe:
    direction: DOWN
    duration: 600
- extendedWaitUntil:
    visible:
      text: ${OFFLINE_PROJECT_NAME}
    timeout: 60000
- takeScreenshot: offline-3-synced

# Tidy up
- runFlow:
    file: ../subflows/archive-project.yaml
    env:
      PROJECT_NAME: ${OFFLINE_PROJECT_NAME}
