# Project CRUD against the real screens: create a project with a unique name,
# see it in the list, rename it, archive it (the app has no delete; archiving
# hides it from every list), and see it gone. Nothing is left behind on
# cloud-dev beyond an archived row, which the next backend reseed removes.
#
# Needs E2E_TEST_EMAIL and E2E_TEST_PASSWORD from the run, for a user who may
# create projects in their organisation. See subflows/sign-in.yaml.
#
# appId comes from the run (`-e APP_ID=...`), see smoke/app-startup.yaml
appId: ${APP_ID}
---
- runFlow: subflows/sign-in.yaml
- evalScript: ${output.projectName = 'E2E ' + Date.now()}
- tapOn:
    id: "bottom-tab-projects"

# Create
- runFlow: subflows/open-new-project.yaml
- tapOn:
    id: "project-name-input"
- inputText: ${output.projectName}
- hideKeyboard
# The form's settings take their defaults from the reference data as it loads
- scrollUntilVisible:
    element:
      id: "create-project-button"
    direction: DOWN
- tapOn:
    id: "create-project-button"

# Read: back on the list, with the new project in it
- extendedWaitUntil:
    visible:
      text: ${output.projectName}
    timeout: 60000
- takeScreenshot: crud-created

# Update: open it, rename it, and see the new name as the details title
- tapOn:
    text: ${output.projectName}
- extendedWaitUntil:
    visible:
      id: "edit-button"
    timeout: 30000
- tapOn:
    id: "edit-button"
- extendedWaitUntil:
    visible:
      id: "project-name-input"
    timeout: 30000
- tapOn:
    id: "project-name-input"
- eraseText: 100
- inputText: ${output.projectName} edited
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "save-button"
    direction: DOWN
- tapOn:
    id: "save-button"
- extendedWaitUntil:
    visible:
      text: ${output.projectName} edited
    timeout: 30000
- takeScreenshot: crud-renamed
- back

# Delete: archive it from the list and see it gone
- runFlow:
    file: subflows/archive-project.yaml
    env:
      PROJECT_NAME: ${output.projectName} edited
- takeScreenshot: crud-archived
