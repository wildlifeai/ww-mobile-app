name: EAS Build & Submit

on:
  # A release is a v* tag: production for both platforms, submitted to the
  # stores. Pushes to main build nothing, so merging a release and tagging it
  # costs two EAS builds, not four; a preview build is a dispatch.
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        type: choice
        options:
          - preview
          - production
      platform:
        description: 'Platform'
        required: true
        type: choice
        options:
          - all
          - android
          - ios

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 22, not 20: eas-cli 20.1.0 pulls @oclif/plugin-autocomplete, which
          # requires Node >=22. On 20 the install fails before any build starts.
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - uses: expo/expo-github-action@v9
        with:
          eas-version: 20.1.0  # pinned: bump deliberately (EAS service stays compatible across CLI minors)
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Determine build profile
        id: config
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "profile=${{ inputs.profile }}" >> $GITHUB_OUTPUT
            echo "platform=${{ inputs.platform }}" >> $GITHUB_OUTPUT
            if [[ "${{ inputs.profile }}" == "production" ]]; then
              echo "submit=true" >> $GITHUB_OUTPUT
            else
              echo "submit=false" >> $GITHUB_OUTPUT
            fi
          else
            # A v* tag, the only push this workflow runs on
            echo "profile=production" >> $GITHUB_OUTPUT
            echo "platform=all" >> $GITHUB_OUTPUT
            echo "submit=true" >> $GITHUB_OUTPUT
          fi

      - name: Validate dependencies
        run: npm run validate:deps

      - name: EAS Build
        id: build
        run: |
          # --json so each build's platform and ID can be handed to the submit
          # step below. It also silences the progress spinner, so the EAS build
          # page is the place to watch a run in flight.
          eas build \
            --profile ${{ steps.config.outputs.profile }} \
            --platform ${{ steps.config.outputs.platform }} \
            --non-interactive \
            --json > eas-build-result.json

          builds=$(node -e "
            const b = require('./eas-build-result.json');
            const list = Array.isArray(b) ? b : [b];
            if (!list.length) { console.error('no builds returned'); process.exit(1); }
            console.log(list.map(x => x.platform.toLowerCase() + ':' + x.id).join(' '));
          ")
          echo "Built: $builds"
          echo "builds=$builds" >> "$GITHUB_OUTPUT"

      - name: Submit to stores
        if: steps.config.outputs.submit == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_KEY }}
        run: |
          # Submit the exact artifacts this run produced.
          #
          # `eas submit --non-interactive` needs both the build (--id) and its
          # --platform, and refuses without either. Missing the first failed
          # every automated submission until Aug 2026, missing the second failed
          # v0.0.70, so releases were submitted by hand until then.
          #
          # --id rather than --latest deliberately: this workflow has no
          # concurrency guard, so a preview build dispatched while a tag runs
          # could be the latest. With --latest it would be submitted to the
          # stores, a cloud-dev configured binary shipped to users.
          #
          # eas.json reads the Play key from a gitignored file, so it is written
          # here from a secret. iOS needs nothing: its App Store Connect key is
          # stored on EAS. Every build is tried even when one fails, so one
          # store's problem does not hold back the other.
          failed=0
          for build in ${{ steps.build.outputs.builds }}; do
            platform="${build%%:*}"
            id="${build#*:}"
            if [[ "$platform" == "android" ]]; then
              if [[ -z "$PLAY_SERVICE_ACCOUNT_KEY" ]]; then
                echo "::error::Android build $id not submitted: the PLAY_SERVICE_ACCOUNT_KEY secret is not set"
                failed=1
                continue
              fi
              key_path=$(node -p "require('./eas.json').submit.production.android.serviceAccountKeyPath")
              printf '%s' "$PLAY_SERVICE_ACCOUNT_KEY" > "$key_path"
            fi
            echo "Submitting $platform build $id"
            eas submit --profile production --platform "$platform" --id "$id" --non-interactive || failed=1
          done
          exit $failed
