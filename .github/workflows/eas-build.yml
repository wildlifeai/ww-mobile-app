name: EAS Build & Submit

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        type: choice
        options:
          - preview
          - production
      platform:
        description: 'Platform'
        required: true
        type: choice
        options:
          - all
          - android
          - ios

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: 20.1.0  # pinned: bump deliberately (EAS service stays compatible across CLI minors)
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Determine build profile
        id: config
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "profile=${{ inputs.profile }}" >> $GITHUB_OUTPUT
            echo "platform=${{ inputs.platform }}" >> $GITHUB_OUTPUT
            if [[ "${{ inputs.profile }}" == "production" ]]; then
              echo "submit=true" >> $GITHUB_OUTPUT
            else
              echo "submit=false" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "profile=production" >> $GITHUB_OUTPUT
            echo "platform=all" >> $GITHUB_OUTPUT
            echo "submit=true" >> $GITHUB_OUTPUT
          else
            echo "profile=preview" >> $GITHUB_OUTPUT
            echo "platform=all" >> $GITHUB_OUTPUT
            echo "submit=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate dependencies
        run: npm run validate:deps

      - name: EAS Build
        id: build
        run: |
          # --json so the build IDs can be handed to the submit step below.
          # It also silences the progress spinner, so the EAS build page is the
          # place to watch a run in flight.
          eas build \
            --profile ${{ steps.config.outputs.profile }} \
            --platform ${{ steps.config.outputs.platform }} \
            --non-interactive \
            --json > eas-build-result.json

          ids=$(node -e "
            const b = require('./eas-build-result.json');
            const list = Array.isArray(b) ? b : [b];
            if (!list.length) { console.error('no builds returned'); process.exit(1); }
            console.log(list.map(x => x.id).join(' '));
          ")
          echo "Built: $ids"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

      - name: Submit to stores
        if: steps.config.outputs.submit == 'true'
        run: |
          # Submit the exact artifacts this run produced.
          #
          # `eas submit --non-interactive` fails outright without an archive
          # source ("You need to specify the archive source when running in
          # non-interactive mode") — which is why every automated submission
          # silently failed until Aug 2026 and releases were made by hand.
          #
          # --id rather than --latest deliberately: this workflow has no
          # concurrency guard, and pushing a release fires both the `main` push
          # (preview) and the `v*` tag (production). With --latest an overlapping
          # preview build could be submitted to the stores — a cloud-dev
          # configured binary shipped to users.
          for id in ${{ steps.build.outputs.ids }}; do
            echo "Submitting build $id"
            eas submit --profile production --id "$id" --non-interactive
          done
