name: Quality Gate Validation

on:
  pull_request:
  merge_group:

concurrency:
  # One run per PR (refs/pull/N/merge) and a fresh push cancels the stale run.
  # A merge-queue entry has its own unique ref, so queue runs never cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate build environment and dependencies
        run: |
          node scripts/validate-build-env.js
          npm run deps:scan

      - name: Validate type system not empty
        run: |
          if [ ! -s src/types/database.types.ts ] || [ $(wc -c < src/types/database.types.ts) -lt 51200 ]; then
            echo "❌ Type system is empty or suspiciously small"
            echo "Expected: 50-100KB, Found: $(wc -c < src/types/database.types.ts) bytes"
            exit 1
          fi

      - name: Check console.log pollution
        run: |
          CONSOLE_LOGS=$(grep -r 'console\.log' src/ --exclude-dir=__tests__ --exclude=logger.ts | wc -l || echo "0")
          if [ "$CONSOLE_LOGS" -gt 0 ]; then
            echo "❌ Found $CONSOLE_LOGS console.log statements"
            grep -rn 'console\.log' src/ --exclude-dir=__tests__ --exclude=logger.ts || true
            exit 1
          fi

      - name: TypeScript compilation
        run: npm run type-check

      - name: Linting
        run: npm run lint

      - name: Version consistency (package.json vs app.config.ts vs android/)
        run: npm run version:check

      - name: Documentation references resolve
        run: npm run docs:validate

      - name: Run tests with coverage
        run: npm test -- --coverage --ci

      - name: Check test coverage threshold
        run: |
          # A ratchet, not a target. Set just under the measured figure so it can
          # only move up: 21.29% statements on 21 September 2026, floor 20. Raise
          # the floor by hand when coverage has genuinely climbed. Until this
          # commit the awk checked "< 10" while the message claimed 70.
          FLOOR=20
          ACTUAL=$(npm test -- --coverage --silent | grep "All files" | awk '{print $4+0}')
          echo "statement coverage: ${ACTUAL}% (floor ${FLOOR}%)"
          awk -v a="$ACTUAL" -v f="$FLOOR" 'BEGIN { exit (a < f) }' || {
            echo "❌ Statement coverage ${ACTUAL}% is below the ${FLOOR}% floor"
            exit 1
          }
