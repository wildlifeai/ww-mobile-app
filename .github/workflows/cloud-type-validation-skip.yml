# Mirror of cloud-type-validation.yml for pull requests that touch no TypeScript
# and not the committed types. Reports the same check names as successes so the
# PR can satisfy the required checks and enter the merge queue, which then runs
# the real validation. Keep `paths-ignore` identical to the `paths` list in
# cloud-type-validation.yml.
name: Cloud Type Validation

on:
  pull_request:
    branches: [dev]
    paths-ignore:
      - 'src/types/database.types.ts'
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - '.github/workflows/cloud-type-validation.yml'

jobs:
  validate-cloud-dev:
    name: Validate Cloud Dev Types
    runs-on: ubuntu-latest
    steps:
      - run: echo "No TypeScript or type-file changes. Nothing to validate against cloud-dev."

  summary:
    name: Cloud Type Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-cloud-dev]
    steps:
      - run: echo "Cloud type validation skipped by path filter."
