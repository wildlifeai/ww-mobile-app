# Mirror of native-build-validation.yml for pull requests that touch none of
# the native-affecting paths. It reports the same check names as successes so a
# docs-only PR can satisfy the required checks and enter the merge queue.
#
# This is the pattern GitHub documents for "skipped but required checks". The
# two `paths-ignore` lists here must stay identical to the `paths` list in
# native-build-validation.yml; if they drift, a PR either builds twice or
# never gets the check at all. The merge queue itself ignores path filters and
# always runs the real build, so nothing unbuilt reaches dev.
name: Native Build Validation

on:
  pull_request:
    paths-ignore:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.config.ts'
      - 'app.json'
      - 'eas.json'
      - 'patches/**'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'tsconfig.json'
      - 'android/**'
      - '.github/workflows/native-build-validation.yml'

jobs:
  android-build:
    name: Android EAS Local Build
    runs-on: ubuntu-latest
    steps:
      - run: echo "No native-affecting files changed. Nothing to build; the merge queue will build the merged result."

  ios-sanity:
    name: iOS Prebuild Sanity Check
    runs-on: ubuntu-latest
    steps:
      - run: echo "No native-affecting files changed. Nothing to prebuild."

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    steps:
      - run: echo "No native-affecting files changed. Nothing to launch; the merge queue runs the real smoke flow."
