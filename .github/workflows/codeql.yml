# Static analysis for the classes nothing else here looks for: injection
# through untrusted input, unsafe regular expressions, prototype pollution,
# insecure randomness. GitGuardian scans for secrets and React Doctor for
# React patterns; this is the third leg (#392).
#
# Advisory: findings go to the Security tab as code scanning alerts and the
# job passes whatever it finds. Make it a required check once the first
# runs have been read and the alerts that matter are fixed or dismissed.
name: CodeQL

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (JavaScript and TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # Generated or vendored code, and the SQL mirror, would only add noise.
          config: |
            paths-ignore:
              - android
              - supabase
              - patches
              - '**/__tests__'
              - '**/__mocks__'
              - '**/*.test.ts'
              - '**/*.test.tsx'

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
