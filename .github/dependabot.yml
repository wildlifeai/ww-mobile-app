# Keeps GitHub Actions pins current via PRs. Workflow dependencies are pinned
# (actions to release tags, CLIs to exact versions) so upstream releases can't
# silently break CI — this config is how those pins get bumped deliberately.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Without this, Dependabot opens PRs against the repository's default branch
    # (main), while all work merges into dev. PR #232 sat open for a month for
    # exactly that reason while five other PRs merged past it, and went stale
    # enough to conflict with the workflow changes in #241.
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'

  # App dependencies. Expo SDK packages, React Native and React are left out:
  # their versions are pinned to the SDK as a set and move together through
  # `npx expo install`, so a lone bump breaks the contract `validate:deps`
  # guards. Everything else arrives as one weekly PR per update type into dev.
  # Security updates ignore the grouping and open on their own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: expo
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'
      - dependency-name: '@react-native-community/*'
      - dependency-name: 'react-native-reanimated'
